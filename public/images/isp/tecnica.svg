<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="illustration-title illustration-desc">
<title id="illustration-title">Técnica: FTTH y monitoreo</title><desc id="illustration-desc">Ilustración vectorial sin texto de red FTTH, monitoreo y mantenimiento de equipos.</desc><style><![CDATA[
:root{color-scheme:light}
.float-soft,.float-coin,.alert-pulse,.signal-pulse,.check-pop,.dash-move{transform-box:fill-box;transform-origin:center}
.float-soft{animation:floatSoft 4.8s ease-in-out infinite}
.float-coin{animation:floatCoin 3.4s ease-in-out infinite}
.alert-pulse{animation:alertPulse 2.6s ease-in-out infinite}
.signal-pulse{animation:signalPulse 3.1s ease-in-out infinite}
.check-pop{animation:checkPop 4s ease-in-out infinite}
.dash-move{animation:dashMove 3s linear infinite}
@keyframes floatSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes floatCoin{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-13px)}}
@keyframes alertPulse{0%,100%{opacity:.4;transform:scale(.94)}50%{opacity:1;transform:scale(1.1)}}
@keyframes signalPulse{0%,100%{opacity:.2;transform:scale(.8)}45%{opacity:1;transform:scale(1.06)}75%{opacity:.45}}
@keyframes checkPop{0%,20%,100%{transform:scale(.93);opacity:.65}30%,75%{transform:scale(1);opacity:1}}
@keyframes dashMove{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion:reduce){.float-soft,.float-coin,.alert-pulse,.signal-pulse,.check-pop,.dash-move{animation:none!important}}
]]></style>
